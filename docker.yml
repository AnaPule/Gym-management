version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: mma_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mma
      POSTGRES_PASSWORD: mma_dev_password
      POSTGRES_DB: mma_development
    ports:
      - "5432:5432"
    volumes:
      - mma_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mma -d mma_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mma_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mma_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: mma_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://mma:mma_dev_password@db:5432/mma_development
      REDIS_URL: redis://redis:6379/0
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - bundle_cache:/usr/local/bundle
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"

  sidekiq:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: mma_sidekiq
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://mma:mma_dev_password@db:5432/mma_development
      REDIS_URL: redis://redis:6379/0
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    volumes:
      - ./api:/app
      - bundle_cache:/usr/local/bundle
    command: bundle exec sidekiq -C config/sidekiq.yml

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: mma_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  mma_pg_data:
  mma_redis_data:
  bundle_cache:
  web_node_modules: